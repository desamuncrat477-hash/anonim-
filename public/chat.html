<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Anonymous Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top left,
            #312e81,
            transparent 35%
        ),
        #070b16;

    color: white;

    font-family:
        Inter,
        system-ui,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 15px;
}


.chat {

    width: min(900px, 100%);

    height: min(700px, 90vh);

    display: flex;

    flex-direction: column;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 24px;

    background:
        rgba(15,23,42,.86);

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.45);

}


.header {

    padding: 18px 22px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

}


.identity {

    display: flex;

    align-items: center;

    gap: 12px;

}


.avatar {

    width: 44px;
    height: 44px;

    display: grid;

    place-items: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

}


.name {

    font-weight: 700;

}


.online {

    color: #22c55e;

    font-size: 12px;

}


.messages {

    flex: 1;

    overflow-y: auto;

    padding: 24px;

    display: flex;

    flex-direction: column;

    gap: 12px;

}


.message {

    max-width: 75%;

    padding: 12px 15px;

    border-radius: 17px;

    font-size: 14px;

    line-height: 1.5;

}


.received {

    align-self: flex-start;

    background:
        rgba(255,255,255,.08);

}


.sent {

    align-self: flex-end;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

}


.input-area {

    display: flex;

    gap: 10px;

    padding: 15px;

    border-top:
        1px solid
        rgba(255,255,255,.08);

}


input {

    flex: 1;

    min-width: 0;

    padding: 14px 16px;

    border: 0;

    outline: none;

    border-radius: 14px;

    background:
        rgba(255,255,255,.07);

    color: white;

}


button {

    padding:
        0 22px;

    border: 0;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    color: white;

    font-weight: 700;

    cursor: pointer;

}


@media(max-width:600px) {

    .chat {

        height: 94vh;

        border-radius: 18px;

    }

    .message {

        max-width: 85%;

    }

}

</style>

</head>

<body>


<div class="chat">

    <header class="header">

        <div class="identity">

            <div class="avatar">
                👤
            </div>

            <div>

                <div class="name">
                    Anonymous
                </div>

                <div class="online">
                    ● Online
                </div>

            </div>

        </div>

        <div>
            🔒
        </div>

    </header>


    <main
        id="messages"
        class="messages"
    >

        <div class="message received">

            Selamat datang di Anonymous Chat 👋

        </div>

        <div class="message received">

            Kamu sekarang terhubung dengan pengguna anonim.

        </div>

    </main>


    <form
        id="chatForm"
        class="input-area"
    >

        <input
            id="messageInput"
            autocomplete="off"
            placeholder="Tulis pesan..."
        >

        <button type="submit">
            Kirim
        </button>

    </form>

</div>


<script>

const form =
    document.getElementById(
        "chatForm"
    );

const input =
    document.getElementById(
        "messageInput"
    );

const messages =
    document.getElementById(
        "messages"
    );


form.addEventListener(
    "submit",
    (event) => {

        event.preventDefault();


        const text =
            input.value.trim();


        if (!text) {
            return;
        }


        const message =
            document.createElement(
                "div"
            );


        message.className =
            "message sent";


        message.textContent =
            text;


        messages.appendChild(
            message
        );


        input.value = "";


        messages.scrollTop =
            messages.scrollHeight;

    }
);

</script>


</body>

</html>
